# Nettlesarvaktene køyrer mot produksjonsbygget, aldri HMR.
# Tida er frå ein delt Linux-tenar, ikkje ein fysisk iPhone eller ein brukar.
name: mobil

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'tsconfig.json'
      - '.github/workflows/mobil.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      devpakke:
        description: 'Ta med kode og installerte pakkar for lokal utvikling'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobil:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      URL: http://127.0.0.1:3210
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pakk utviklingskopi
        if: ${{ inputs.devpakke || contains(github.event.head_commit.message, '[devpakke]') }}
        run: |
          tar --exclude='./.git' --exclude='./.next/cache' --exclude='./bilete' --exclude='./.env*' -czf /tmp/slicer-dev.tgz .
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.devpakke || contains(github.event.head_commit.message, '[devpakke]') }}
        with:
          name: slicer-dev
          path: /tmp/slicer-dev.tgz
          retention-days: 1
          compression-level: 0
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start produksjonsbygg
        run: |
          mkdir -p bilete/mobil
          pnpm start -p 3210 > bilete/mobil/tenar.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail "$URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat bilete/mobil/tenar.log
          exit 1
      - name: Gjentaking held mål og kuttgeometri
        run: pnpm exec tsx scripts/gjenta-sjekk.ts
        env:
          GJENTA_UT: bilete/gjenta-geometri
      - name: Seks ribber med og utan gjentaking
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/gjenta-mobil.ts
      - name: WebKit med mobilflate
        if: ${{ !cancelled() }}
        run: pnpm webkit
      - name: Redigering med fingrane
        if: ${{ !cancelled() }}
        run: pnpm redigering
      - name: Avbrote teiknedrag
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/avbrot-sjekk.ts
      - name: Direkte tilgang til kuttfiler
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/uttak-sjekk.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobil-resultat
          path: bilete/
          retention-days: 7
          if-no-files-found: warn
